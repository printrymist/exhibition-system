<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rohei_Printer（宮川良平）— 木版画</title>
<meta property="og:title" content="Rohei_Printer（宮川良平）— 木版画">
<meta property="og:description" content="QRコードと木版画を組み合わせた作品を制作しています。">
<meta property="og:image" content="https://qriine.com/assets/rohei/qrface_set.jpg">
<link rel="icon" type="image/jpeg" href="/assets/rohei/icon.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#262421;
    --ink-soft:#55524c;
    --washi:#f3eee3;
    --indigo-deep:#152943;
    --line:#d9d2c0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--washi);color:var(--ink);
    font-family:"Noto Sans JP",sans-serif;line-height:1.9;
  }
  .wrap{max-width:880px;margin:0 auto;padding:0 24px;}

  header{padding:56px 0 36px;}
  .profile{display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
  .avatar{
    width:84px;height:84px;border-radius:50%;object-fit:cover;
    border:1px solid var(--line);flex:none;
  }
  h1{
    font-family:"Shippori Mincho",serif;font-weight:700;
    font-size:26px;color:var(--indigo-deep);margin:0;letter-spacing:.02em;
  }
  .bio{margin:6px 0 0;font-size:14.5px;color:var(--ink-soft);}
  .ig-link{
    display:inline-block;margin-top:10px;text-decoration:none;
    font-size:13.5px;color:var(--indigo-deep);
    border:1px solid var(--line);border-radius:3px;padding:6px 14px;background:#fff;
  }
  .ig-link:hover{background:#faf7ef;}

  .works{padding:8px 0 72px;}
  .grid{
    display:grid;grid-template-columns:1fr 1fr;gap:28px 24px;
  }
  figure{margin:0;}
  figure img{
    display:block;width:100%;height:auto;
    border:1px solid var(--line);background:#fff;
  }
  figcaption{
    font-size:13px;color:var(--ink-soft);margin-top:8px;
    font-family:"Shippori Mincho",serif;letter-spacing:.04em;
  }
  .full{grid-column:1 / -1;max-width:640px;margin:0 auto;}

  footer{
    border-top:1px solid var(--line);padding:28px 0 48px;
    font-size:13px;color:var(--ink-soft);
  }
  footer a{color:var(--indigo-deep);}

  @media (max-width:560px){
    .grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="profile">
      <img class="avatar" src="/assets/rohei/icon.jpg" alt="">
      <div>
        <h1>Rohei_Printer（宮川良平）</h1>
        <p class="bio">QRコードと木版画を組み合わせた作品を制作しています。</p>
        <a class="ig-link" href="https://instagram.com/rohei_printer" target="_blank" rel="noopener">Instagram @rohei_printer</a>
      </div>
    </div>
  </div>
</header>

<section class="works">
  <div class="wrap">
    <div class="grid">
      <figure class="full">
        <img src="/assets/rohei/qrface_set.jpg" alt="QR Face 組み絵">
        <figcaption>QR Face（組み絵）— 2026・木版画</figcaption>
      </figure>
      <figure>
        <img src="/assets/rohei/qrface_05.jpg" alt="QR Face">
        <figcaption>QR Face — 2026・木版画</figcaption>
      </figure>
      <figure>
        <img src="/assets/rohei/qrflower_01.jpg" alt="QR 花 ヒルサキツキミソウ 組み絵">
        <figcaption>QR 花 ヒルサキツキミソウ — 2026・木版画</figcaption>
      </figure>
      <figure>
        <img src="/assets/rohei/maskedman_set.jpg" alt="Masked man">
        <figcaption>Masked man</figcaption>
      </figure>
      <figure>
        <img src="/assets/rohei/maskedman_red.jpg" alt="Masked man">
        <figcaption>Masked man</figcaption>
      </figure>
      <figure>
        <img src="/assets/rohei/noboru_02.jpg" alt="Noboru's story">
        <figcaption>Noboru's story</figcaption>
      </figure>
      <figure>
        <img src="/assets/rohei/mayonaka.jpg" alt="真夜中に生きる">
        <figcaption>真夜中に生きる — 2023・木版画</figcaption>
      </figure>
      <figure>
        <img src="/assets/rohei/buurabuura.jpg" alt="ぶーらぶーら">
        <figcaption>ぶーらぶーら — 2023・木版画</figcaption>
      </figure>
    </div>
  </div>
</section>

<footer>
  <div class="wrap">
    <p>Rohei_Printer（宮川良平） ／ <a href="https://instagram.com/rohei_printer" target="_blank" rel="noopener">Instagram @rohei_printer</a></p>
  </div>
</footer>

</body>
</html>
