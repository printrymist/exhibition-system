<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/assets/logo/qriine_lc_3_icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script src="js/diag.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>お問い合わせ - Qriine</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: #f4f4f9; color: #1a2a4a; margin: 0; padding: 24px;
      line-height: 1.6;
    }
    .card {
      max-width: 560px; margin: 24px auto; background: #fff;
      border-radius: 14px; padding: 28px 26px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }
    h1 { font-size: 1.3em; margin: 0 0 4px; }
    .sub { color: #666; font-size: 0.9em; margin: 0 0 20px; }
    label.field-label { display: block; font-weight: bold; font-size: 0.9em; margin: 16px 0 6px; }
    .req { color: #d93025; font-size: 0.8em; margin-left: 4px; }
    input[type="text"], input[type="email"], textarea {
      width: 100%; padding: 11px 13px; border: 1px solid #ccc;
      border-radius: 8px; font-size: 15px; font-family: inherit;
    }
    input:focus, textarea:focus { outline: none; border-color: #1a73e8; }
    textarea { min-height: 150px; resize: vertical; }
    .hp { position: absolute; left: -9999px; top: -9999px; width: 1px; height: 1px; overflow: hidden; }
    .btn {
      margin-top: 22px; width: 100%; padding: 13px;
      background: #1a73e8; color: #fff; border: none; border-radius: 8px;
      font-size: 16px; font-weight: bold; cursor: pointer;
    }
    .btn:hover:not(:disabled) { background: #1557b0; }
    .btn:disabled { opacity: 0.5; cursor: wait; }
    .msg { margin-top: 14px; padding: 12px 14px; border-radius: 8px; font-size: 0.9em; display: none; }
    .msg.ok { background: #e8f5e9; color: #2e7d32; display: block; }
    .msg.err { background: #ffebee; color: #c62828; display: block; }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: -2px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .note { font-size: 0.82em; color: #888; margin-top: 18px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>お問い合わせ</h1>
    <p class="sub">Qriine についてのご質問・ご相談はこちらから。担当者よりメールでご返信します。</p>

    <div id="formArea">
      <label class="field-label" for="nameInput">お名前</label>
      <input type="text" id="nameInput" placeholder="例）山田 太郎" autocomplete="name">

      <label class="field-label" for="emailInput">メールアドレス<span class="req">必須</span></label>
      <input type="email" id="emailInput" placeholder="返信先のメールアドレス" autocomplete="email">

      <label class="field-label" for="subjectInput">件名</label>
      <input type="text" id="subjectInput" placeholder="一行で要点を">

      <label class="field-label" for="bodyInput">本文<span class="req">必須</span></label>
      <textarea id="bodyInput" placeholder="ご質問・ご相談の内容をお書きください。"></textarea>

      <div class="hp" aria-hidden="true">
        <label>この欄は入力しないでください<input type="text" id="hpInput" tabindex="-1" autocomplete="off"></label>
      </div>

      <button class="btn" id="btnSubmit" onclick="submitContact()">送信する</button>
      <div class="msg" id="msg"></div>
    </div>

    <p class="note">送信いただいた内容は Qriine 運営が確認し、ご入力のメールアドレスへ返信します。</p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>
  <script>
    firebase.initializeApp({
      apiKey: "AIzaSyBdwIxKuT6MYJalWUIEgMZVanvrLEMKcRg",
      authDomain: "rohei-printer-system.firebaseapp.com",
      projectId: "rohei-printer-system",
      storageBucket: "rohei-printer-system.firebasestorage.app",
      messagingSenderId: "762429995901",
      appId: "1:762429995901:web:f3b330d26897dc3214ea14"
    });
    var _submitContactFn = firebase.app().functions('asia-northeast1').httpsCallable('submitContact');

    function showMsg(text, cls) {
      var el = document.getElementById('msg');
      el.className = 'msg ' + cls;
      el.innerHTML = text;
    }

    async function submitContact() {
      var name = document.getElementById('nameInput').value.trim();
      var email = document.getElementById('emailInput').value.trim();
      var subject = document.getElementById('subjectInput').value.trim();
      var message = document.getElementById('bodyInput').value.trim();
      var hp = document.getElementById('hpInput').value;

      if (!email) { showMsg('メールアドレスを入力してください。', 'err'); return; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showMsg('メールアドレスの形式が正しくありません。', 'err'); return; }
      if (!message) { showMsg('本文を入力してください。', 'err'); return; }

      var btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      showMsg('<span class="spinner"></span> 送信中…', 'ok');
      try {
        await _submitContactFn({ name: name, email: email, subject: subject, message: message, hp: hp });
        document.getElementById('formArea').innerHTML =
          '<div class="msg ok" style="display:block;">送信しました。ご入力のメールアドレスへ返信いたします。ありがとうございました。</div>';
      } catch (e) {
        btn.disabled = false;
        var m = (e && e.message) ? e.message : '送信に失敗しました。時間をおいてお試しください。';
        showMsg(m, 'err');
      }
    }
  </script>
</body>
</html>
